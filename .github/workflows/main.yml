name: Deploy to DigitalOcean

on:
  push:
    branches:
      - "**" # Trigger on all branches
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test Docker build
        run: |
          echo "Testing Dockerfile build..."
          docker build -t test-image .
          echo "Docker build completed successfully!"

      - name: Test Docker Compose
        run: |
          echo "Testing Docker Compose..."
          docker compose config
          echo "Docker Compose configuration is valid!"

      - name: Test Full Docker Compose Deployment
        run: |
          echo "Testing full Docker Compose deployment..."

          # Start containers
          docker compose up -d

          # Wait for containers to start
          echo "Waiting for containers to start..."
          sleep 15

          # Check if containers are running
          echo "Checking container status..."
          docker compose ps

          # Verify containers are healthy
          if docker compose ps | grep -q "Up"; then
            echo "✅ Containers are running successfully!"
          else
            echo "❌ Some containers failed to start"
            docker compose logs
            exit 1
          fi

          # Clean up - stop and remove containers
          echo "Cleaning up test containers..."
          docker compose down

          echo "✅ Full Docker Compose test completed successfully!"

  deploy:
    runs-on: ubuntu-latest
    needs: test # Only deploy if tests pass
    if: github.ref == 'refs/heads/main' # Only deploy from main branch

    steps:
      - name: Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting WEB-ONLY deployment..."

            # Navigate to the application directory
            cd /root/app/genesis/ || {
              echo "❌ Failed to navigate to /root/app/genesis/"
              exit 1
            }

            echo "💾 Creating database backup..."
            mkdir -p /backup
            if docker ps --format '{{.Names}}' | grep -q genesis-mongo; then
              docker exec genesis-mongo mongodump --out /backup/backup-$(date +%Y%m%d-%H%M%S) || echo "⚠️ MongoDB backup failed"
            else
              echo "⚠️ MongoDB container not found - skipping backup"
            fi

            # Pull latest code
            git pull origin main

            # Stop and update ONLY web service
            echo "🔄 Updating web service only..."
            docker compose stop web
            docker compose build web
            docker compose up -d web

            # Health check with retries
            echo "🏥 Performing health check..."
            max_attempts=15
            attempt=1
            
            while [ $attempt -le $max_attempts ]; do
              if docker compose ps web | grep -q "Up"; then
                echo "✅ Web service updated successfully!"
                break
              fi
              
              if [ $attempt -eq $max_attempts ]; then
                echo "❌ Web service failed to start"
                docker compose logs web --tail=20
                exit 1
              fi
              
              echo "⏳ Attempt $attempt/$max_attempts..."
              sleep 2
              ((attempt++))
            done

            echo "✅ Web-only deployment completed at $(date)!"
